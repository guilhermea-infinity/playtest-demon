name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  desk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: node scripts/check-ui.js
      - run: node --test tests/test_capture.js
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - run: ./build.sh
      - run: bash scripts/check-routing.sh
      - uses: actions/upload-artifact@v4
        with:
          name: PlaytestDemon-debug-apk
          path: out/*.apk
  mac-app:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements-mac-build.txt
      - run: python scripts/package-mac.py
      - name: Verify bundled service
        run: '"out/mac/Playtest Demon.app/Contents/Resources/service/PlaytestDemonService" --help'
      - uses: actions/upload-artifact@v4
        with:
          name: PlaytestDemon-macOS-app
          path: |
            out/mac/*.zip
            out/mac/*.dmg
